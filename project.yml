name: MyBarTrack
options:
  bundleIdPrefix: com.polidisio
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.86.0

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_NAME: "$(TARGET_NAME)"
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"

targets:
  MyBarTrack:
    type: application
    platform: iOS
    sources:
      - path: MIConsumoBar
        excludes:
          - "**/*.md"
      - path: Shared
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_FILE: MyBarTrack-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.polidisio.MyBarTrack
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DQ7D6387N8
        CODE_SIGN_ENTITLEMENTS: MyBarTrack.entitlements
    dependencies:
      - target: DrinkTrackWidgetExtension
        embed: true
      - package: PostHog
      - target: MyBarTrackWatch

  DrinkTrackWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: DrinkTrackWidget
      - path: Shared
        excludes:
          - "Watch/**"
      - path: MIConsumoBar/Resources
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_FILE: DrinkTrackWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.polidisio.MyBarTrack.DrinkTrackWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DQ7D6387N8
        CODE_SIGN_ENTITLEMENTS: DrinkTrackWidget/DrinkTrackWidget.entitlements
        SKIP_INSTALL: true
    dependencies: []

  MyBarTrackWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MyBarTrackWatch
        excludes:
          - Info.plist
      - path: Shared/Watch
      - path: Shared/WidgetSnapshot.swift
      - path: MIConsumoBar/Resources/Localizable.xcstrings
    info:
      path: MyBarTrackWatch/Info.plist
      properties:
        CFBundleDisplayName: MyBarTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.polidisio.MyBarTrack
    settings:
      base:
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        PRODUCT_BUNDLE_IDENTIFIER: com.polidisio.MyBarTrack.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DQ7D6387N8
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true

  DrinkTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MIConsumoBarTests
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_FILE: MIConsumoBarTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.polidisio.MyBarTrackTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyBarTrack.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MyBarTrack"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MyBarTrack

schemes:
  MyBarTrack:
    build:
      targets:
        MyBarTrack: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DrinkTrackTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
